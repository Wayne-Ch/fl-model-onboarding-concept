    CandidateOutcome:
      type: object
      required:
        - model_id
        - revision
        - profile
        - status
        - tested_status
        - failed_stage
        - classification
        - error_summary
        - versions
        - gate_outcomes
        - evidence_reference
        - capability_owner
        - next_action
      properties:
        model_id:
          type: string
        revision:
          type: string
        profile:
          type: string
        status:
          type: string
          enum: [blocked]
        tested_status:
          type: string
          enum: [not_verified]
