openapi: 3.1.0
info:
  title: Foundry Local Onboarding POC API
  version: 0.1.0
  description: >
    Loopback-only POC API contracts for model onboarding. Build and preflight are idempotent
    and side-effect constrained to local cache/workspace operations.
servers:
  - url: http://127.0.0.1:8777
paths:
  /api/preflight:
    post:
      summary: Run idempotent candidate preflight
      operationId: preflightCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreflightRequest"
      responses:
        "200":
          description: Cached or newly computed preflight result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightResponse"
  /api/builds:
    post:
      summary: Create or replay a build job by idempotency key
      operationId: createBuild
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildCreateRequest"
      responses:
        "200":
          description: New job or idempotent replay of the original job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildCreateResponse"
        "409":
          description: Idempotency key reused with a different body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/builds/{job_id}:
    get:
      summary: Get build job status
      operationId: getBuild
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Build job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildJob"
  /api/builds/{job_id}/events:
    get:
      summary: Poll monotonic job events
      operationId: getBuildEvents
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
        - in: query
          name: after
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Events with sequence strictly greater than `after`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildEventsResponse"
  /api/builds/{job_id}/cancel:
    post:
      summary: Cancel an active build job
      operationId: cancelBuild
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildJob"
        "409":
          description: Job is not in a cancellable state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/artifacts/{artifact_id}/infer/text:
    post:
      summary: Infer text from a completed text-capable artifact
      operationId: inferText
      parameters:
        - in: path
          name: artifact_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextInferenceRequest"
      responses:
        "200":
          description: Inference result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextInferenceResponse"
        "409":
          description: Artifact is unavailable due to failed/cancelled build or lifecycle state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Artifact does not support text inference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/artifacts/{artifact_id}/infer/asr:
    post:
      summary: Infer transcription from a completed ASR-capable artifact
      operationId: inferAsr
      parameters:
        - in: path
          name: artifact_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsrInferenceRequest"
      responses:
        "200":
          description: Inference result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsrInferenceResponse"
        "409":
          description: Artifact is unavailable due to failed/cancelled build or lifecycle state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Artifact does not support ASR inference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    BuildState:
      type: string
      enum:
        - queued
        - preflight
        - downloading
        - mobius_building
        - mobius_validating
        - olive_optimizing
        - packaging
        - runtime_validating
        - fl_loading
        - inferencing
        - succeeded
        - failed
        - cancelled
    FailureInfo:
      type: object
      required: [stage, classification, message]
      properties:
        stage:
          $ref: "#/components/schemas/BuildState"
        classification:
          type: string
        message:
          type: string
        detail:
          type: object
          additionalProperties:
            type: string
    BuildArtifact:
      type: object
      required: [artifact_id, kind, path, description]
      properties:
        artifact_id:
          type: string
        kind:
          type: string
        path:
          type: string
        description:
          type: string
        size_bytes:
          type: integer
          nullable: true
        sha256:
          type: string
          nullable: true
    JobEvent:
      type: object
      required: [sequence, timestamp_utc, state, message]
      properties:
        sequence:
          type: integer
          minimum: 1
        timestamp_utc:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/BuildState"
        message:
          type: string
    BuildJob:
      type: object
      required: [job_id, state, request, started_utc, events, artifacts]
      properties:
        job_id:
          type: string
        state:
          $ref: "#/components/schemas/BuildState"
        request:
          $ref: "#/components/schemas/BuildRequestContext"
        started_utc:
          type: string
          format: date-time
        finished_utc:
          type: string
          format: date-time
          nullable: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/JobEvent"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/BuildArtifact"
        failure:
          $ref: "#/components/schemas/FailureInfo"
        result_artifact_id:
          type: string
          nullable: true
    BuildRequestContext:
      type: object
      required: [candidate, workspace_root, model_cache_dir, output_dir, task_profile, runtime]
      properties:
        candidate:
          type: object
          required: [key, huggingface_model_id, modality]
          properties:
            key:
              type: string
            huggingface_model_id:
              type: string
            modality:
              type: string
            recommended_mobius_dtype:
              type: string
              nullable: true
            recommended_olive_precision:
              type: string
              nullable: true
            notes:
              type: string
        workspace_root:
          type: string
        model_cache_dir:
          type: string
        output_dir:
          type: string
        task_profile:
          type: string
        hf_revision:
          type: string
          nullable: true
        runtime:
          type: string
        external_data_format:
          type: string
        max_shard_size:
          type: string
        enforce_cpu_target:
          type: boolean
        skip_olive:
          type: boolean
        dry_run:
          type: boolean
    BuildCreateRequest:
      type: object
      required: [candidate_key, task_profile]
      properties:
        candidate_key:
          type: string
        task_profile:
          type: string
        hf_revision:
          type: string
          nullable: true
        dry_run:
          type: boolean
          default: false
    BuildCreateResponse:
      type: object
      required: [job, idempotent_replay]
      properties:
        idempotent_replay:
          type: boolean
        job:
          $ref: "#/components/schemas/BuildJob"
    BuildEventsResponse:
      type: object
      required: [job_id, after, events]
      properties:
        job_id:
          type: string
        after:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: "#/components/schemas/JobEvent"
    PreflightRequest:
      type: object
      required: [candidate_key, task_profile]
      properties:
        candidate_key:
          type: string
        task_profile:
          type: string
        hf_revision:
          type: string
          nullable: true
    PreflightResponse:
      type: object
      required: [cache_key, ok]
      properties:
        cache_key:
          type: string
        ok:
          type: boolean
        result:
          type: object
    TextInferenceRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4096
          default: 128
    TextInferenceResponse:
      type: object
      required: [artifact_id, output]
      properties:
        artifact_id:
          type: string
        output:
          type: string
    AsrInferenceRequest:
      type: object
      required: [audio_path]
      properties:
        audio_path:
          type: string
    AsrInferenceResponse:
      type: object
      required: [artifact_id, transcript]
      properties:
        artifact_id:
          type: string
        transcript:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
