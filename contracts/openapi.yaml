          type: string
        compatibility_index:
          type: array
          items:
            $ref: "#/components/schemas/TestedModel"

    ModelVerification:
      type: object
      required: [status, evidence, artifact_id, verified_utc]
      properties:
        status:
          type: string
          enum: [tested, not_verified]
